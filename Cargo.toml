[package]
name = "openrazer"
version = "0.2.0"
description = "Asynchronous bindings to the OpenRazer daemon."
repository = "https://github.com/synsejse/openrazer-rs"
readme = "Readme.md"
license = "MIT"
authors = ["SnejUgal <contact@snejugal.ru>"]
edition = "2024"
rust-version = "1.99"
keywords = ["razer", "openrazer"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
zbus = { version = "=6.1.0", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
zbus = { version = "=6.1.0", default-features = false, features = ["tokio", "service"] }

[lints.rust]
unsafe_code = "forbid"
