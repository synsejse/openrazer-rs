[package]
name = "openrazer"
version = "0.1.0"
description = "Asynchronous bindings to the OpenRazer daemon."
repository = "https://gitlab.com/SnejUgal/openrazer-rs"
readme = "./Readme.md"
license = "MIT"
authors = ["SnejUgal <contact@snejugal.ru>"]
edition = "2018"
keywords = ["razer", "openrazer"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
dbus-async = "1"
dbus-message-parser = "2.2"
tokio = { version = "0.2", features = ["rt-core"] }
serde_json = "1"
xmltree = "0.10"
futures = "0.3"

[dev-dependencies]
rand = "0.7"
palette ="0.5"

[[example]]
name = "basic_effect"
required-features = ["tokio/macros"]

[[example]]
name = "advanced_effect"
required-features = ["tokio/macros"]

[[example]]
name = "custom_starlight"
required-features = ["tokio/macros", "tokio/time", "tokio/sync"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
